<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chapecoense — Sistema de Gestão de Sócios</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- ── TELA DE LOGIN ───────────────────────────────────── -->
  <div id="tela-login" class="login-wrapper">
    <div class="login-card">

      <div class="login-header">
        <div class="login-escudo">⚽</div>
        <h1 class="login-titulo">Chapecoense</h1>
        <p class="login-subtitulo">Sistema de Gestão de Sócios</p>
      </div>

      <form id="form-login" class="login-form">
        <div class="mb-3">
          <label for="email" class="form-label">E-mail</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
            <input type="email" class="form-control" id="email" placeholder="seu@email.com" required>
          </div>
        </div>
        <div class="mb-4">
          <label for="senha" class="form-label">Senha</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
            <input type="password" class="form-control" id="senha" placeholder="••••••••" required>
          </div>
        </div>
        <div id="login-erro" class="alert alert-danger py-2 d-none" role="alert"></div>
        <button type="submit" class="btn btn-chap w-100" id="btn-login">
          <i class="bi bi-box-arrow-in-right me-2"></i>Entrar
        </button>
      </form>

      <div class="login-footer">
        Associação Chapecoense de Futebol
      </div>
    </div>
  </div>

  <!-- ── APP (visível após login) ───────────────────────── -->
  <div id="app" class="app-wrapper d-none">

    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-brand">
        <span class="sidebar-escudo">⚽</span>
        <div>
          <div class="sidebar-nome">Chapecoense</div>
          <div class="sidebar-slogan">Gestão de Sócios</div>
        </div>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-section-label">Menu</div>
        <a href="#" class="nav-item active" data-pagina="dashboard">
          <i class="bi bi-speedometer2"></i> Dashboard
        </a>
        <a href="#" class="nav-item" data-pagina="socios">
          <i class="bi bi-people"></i> Sócios
        </a>
        <a href="#" class="nav-item nav-financeiro d-none" data-pagina="mensalidades">
          <i class="bi bi-cash-coin"></i> Mensalidades
        </a>
        <a href="#" class="nav-item nav-admin d-none" data-pagina="usuarios">
          <i class="bi bi-person-gear"></i> Usuários
        </a>
      </nav>

      <div class="sidebar-footer">
        <div id="info-usuario" class="sidebar-usuario"></div>
        <button id="btn-logout" class="btn btn-logout">
          <i class="bi bi-box-arrow-left me-1"></i> Sair
        </button>
      </div>
    </aside>

    <!-- Conteúdo principal -->
    <main class="app-main">
      <div id="pagina-dashboard"    class="pagina"></div>
      <div id="pagina-socios"       class="pagina d-none"></div>
      <div id="pagina-mensalidades" class="pagina d-none"></div>
      <div id="pagina-usuarios"     class="pagina d-none"></div>
    </main>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/dashboard.js"></script>
  <script src="/js/socios.js"></script>
  <script src="/js/mensalidades.js"></script>
  <script src="/js/usuarios.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
